# athena.yaml — travels with the repo. Engine and UI do not read this file.
# Precedence: CLI flag > environment variable > this file > default

fail_on: high
format: sarif
output: athena-results.sarif
modes:
  - code-review
  - secrets
  - iac
  - sca
  - pipeline
exclude:
  - "tests/**"
  - "**/*.test.py"
  - "vendor/**"
