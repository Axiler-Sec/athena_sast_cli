name: 'Athena SAST'
description: 'OWASP CI/CD-aligned SAST via the Athena CLI (engine APIs + local pipeline gate)'
author: Athena
branding:
  icon: shield
  color: blue

# CICD-SEC-5: least privilege. Callers may raise security-events for SARIF upload.
permissions:
  contents: read
  security-events: write

# CICD-SEC-4 / pwn request: do NOT run this action from pull_request_target
# while checking out the PR head. Fork PRs would inherit this repo's
# ATHENA_API_KEY / ATHENA_REPO_TOKEN. Use pull_request (or push) only.

inputs:
  target:
    description: 'Local checkout path for the pipeline gate'
    default: '.'
  repo:
    description: 'Git repository URL (engine scan). Empty = local gate only.'
    default: ''
  branch:
    description: 'Branch to scan'
    default: ''
  fail-on:
    description: 'Severity gate (critical|high|medium|low)'
    default: 'high'
  modes:
    description: 'Comma-separated modes'
    default: 'code-review,secrets,iac,sca,pipeline'
  sarif-output:
    description: 'SARIF output path (CLI-normalized, not engine SARIF)'
    default: 'athena-results.sarif'
  json-output:
    description: 'JSON output path'
    default: 'athena-results.json'

outputs:
  sarif-file:
    description: 'Path to CLI-normalized SARIF'
    value: ${{ inputs.sarif-output }}
  json-file:
    description: 'Path to Athena JSON'
    value: ${{ inputs.json-output }}

runs:
  using: composite
  steps:
    - name: Install Athena CLI
      shell: bash
      run: |
        set +x
        python3 -m pip install --upgrade pip
        python3 -m pip install "${GITHUB_ACTION_PATH}"

    # CICD-SEC-4: never splice ${{ }} into bash. github.head_ref / inputs can
    # carry $(...) and still expand inside double quotes. env: is assignment,
    # not eval — then quote the variables.
    - name: Run Athena scan
      id: scan
      shell: bash
      env:
        # CICD-SEC-6: secrets from the caller workflow env, never hardcoded.
        # QA: never add set -x here — tokens would land in plaintext logs.
        ATHENA_API_URL: ${{ env.ATHENA_API_URL }}
        ATHENA_API_KEY: ${{ env.ATHENA_API_KEY }}
        ATHENA_REPO_TOKEN: ${{ env.ATHENA_REPO_TOKEN }}
        ATHENA_SCAN_TARGET: ${{ inputs.target }}
        ATHENA_SCAN_REPO: ${{ inputs.repo }}
        ATHENA_SCAN_BRANCH: ${{ inputs.branch }}
        ATHENA_SCAN_MODES: ${{ inputs.modes }}
        ATHENA_SCAN_FAIL_ON: ${{ inputs.fail-on }}
        ATHENA_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        ATHENA_JSON_OUTPUT: ${{ inputs.json-output }}
      run: |
        set +x
        set +e
        EXTRA=()
        if [ -n "${ATHENA_SCAN_REPO}" ]; then
          EXTRA+=(--repo "${ATHENA_SCAN_REPO}")
        fi
        if [ -n "${ATHENA_SCAN_BRANCH}" ]; then
          EXTRA+=(--branch "${ATHENA_SCAN_BRANCH}")
        fi
        athena scan \
          --target "${ATHENA_SCAN_TARGET}" \
          --modes "${ATHENA_SCAN_MODES}" \
          --format sarif \
          --output "${ATHENA_SARIF_OUTPUT}" \
          --json-output "${ATHENA_JSON_OUTPUT}" \
          --fail-on "${ATHENA_SCAN_FAIL_ON}" \
          --quiet \
          "${EXTRA[@]}"
        SCAN_EXIT=$?
        exit $SCAN_EXIT

    # CICD-SEC-10: always upload SARIF. CICD-SEC-8: pin to commit SHA, not @v3.
    - name: Upload SARIF (GitHub Code Scanning)
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@b8ed34e6ff8a3049f4f8c90c055bf2397a014474 # v3.28.18
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: 'athena-sast'
