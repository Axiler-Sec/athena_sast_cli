name: Athena CLI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test local OWASP gate
        run: |
          set +x
          python3 -m pip install pytest
          python3 -m pytest tests/test_athena.py tests/test_client.py tests/test_redact.py tests/test_mcp.py -v
      - name: Dogfood local pipeline gate
        run: |
          set +x
          python3 athena.py scan --local . --modes pipeline --fail-on critical --quiet
          python3 athena.py version
          python3 athena.py owasp
