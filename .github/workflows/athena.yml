# Checkpoint G3: local OWASP pipeline gate only.
# No secrets, no --repo. GitHub-hosted runners cannot reach localhost:8012.
# Engine-from-GitHub is Checkpoint G4 in docs/CI.md — do not add it here yet.
#
# CICD-SEC-4: pull_request, never pull_request_target (pwn request).
# CICD-SEC-8: pin third-party actions to a 40-character commit SHA, not @v4/@main.
name: Athena SAST
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  athena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./
        with:
          target: '.'
          fail-on: high
          modes: pipeline
      - name: Athena monitor (record; does not gate on findings)
        if: always()
        run: |
          set +x
          python3 -m pip install --quiet "${GITHUB_WORKSPACE}"
          athena monitor --target . --modes pipeline --quiet
