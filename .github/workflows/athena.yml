# Checkpoint G3: local OWASP pipeline gate only.
# No secrets, no --repo. GitHub-hosted runners cannot reach localhost:8012.
# Engine-from-GitHub is a separate workflow (athena-engine.yml) — do not add it here yet.
#
# CICD-SEC-4: pull_request, never pull_request_target (pwn request).
# CICD-SEC-8: pin third-party actions to a 40-character commit SHA, not @v4/@main.
name: Athena SAST
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  athena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: ./
        with:
          target: '.'
          fail-on: high
          modes: pipeline
      - name: Athena monitor (record; does not gate on findings)
        if: always()
        run: |
          set +x
          python3 -m pip install --quiet "${GITHUB_WORKSPACE}"
          athena monitor --target . --modes pipeline --quiet
