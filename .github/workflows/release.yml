# Publish PyPI wheel, OS binaries, and GHCR image on version tags.
name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check tag matches pyproject version
        run: |
          set +x
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG"
      - name: Build sdist and wheel
        run: |
          set +x
          python3 -m pip install --upgrade pip build twine
          python3 -m build
          python3 -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true

  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: PyInstaller
        shell: bash
        run: |
          set +x
          python3 -m pip install --upgrade pip pyinstaller
          python3 -m pip install .
          python3 -m PyInstaller --noconfirm --clean packaging/athena.spec
          VER="${GITHUB_REF_NAME#v}"
          OUT="athena-${VER}-${{ matrix.target }}${{ matrix.ext }}"
          mkdir -p dist/release
          if [ -f dist/athena.exe ]; then
            mv dist/athena.exe "dist/release/${OUT}"
          else
            mv dist/athena "dist/release/${OUT}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  docker:
    name: GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: img
        run: |
          set +x
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          VER="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/${OWNER}/athena-sast-cli:${VER},ghcr.io/${OWNER}/athena-sast-cli:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.img.outputs.tags }}

  github-release:
    name: GitHub Release + checksums
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set +x
          cd artifacts
          sha256sum athena-* | tee SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
