# Checkpoint G4: engine scan from GitHub-hosted runners.
# Off until repo variable ATHENA_ENABLE_ENGINE=true (Settings → Variables).
# Requires secrets ATHENA_API_URL (https://your-domain) and ATHENA_API_KEY.
# CICD-SEC-4: pull_request, never pull_request_target.
# CICD-SEC-8: pin third-party actions to a 40-character commit SHA.
name: Athena engine
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  athena-engine:
    if: ${{ vars.ATHENA_ENABLE_ENGINE == 'true' }}
    runs-on: ubuntu-latest
    env:
      ATHENA_API_URL: ${{ secrets.ATHENA_API_URL }}
      ATHENA_API_KEY: ${{ secrets.ATHENA_API_KEY }}
      ATHENA_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Refuse cleartext engine URL
        run: |
          set +x
          url="${ATHENA_API_URL:-}"
          case "$url" in
            "")
              echo "ATHENA_API_URL is not set"
              exit 2
              ;;
            https://*|http://127.0.0.1*|http://localhost*|http://[::1]*)
              ;;
            http://*)
              echo "Refuse public HTTP engine URL (API key would travel in cleartext)."
              echo "Use https://your-domain (ACM) or a self-hosted runner with loopback."
              exit 2
              ;;
            *)
              echo "ATHENA_API_URL must be https://… (or loopback http for a self-hosted runner)"
              exit 2
              ;;
          esac
      - uses: ./
        with:
          target: '.'
          fail-on: high
          repo: ${{ github.server_url }}/${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
          modes: code-review,secrets,iac,sca,pipeline
      # CICD-SEC-4: github.head_ref is untrusted. Pass via env, never ${{ }} in run:.
      - name: Athena monitor (record; does not gate on findings)
        if: always()
        env:
          ATHENA_SCAN_REPO: ${{ github.server_url }}/${{ github.repository }}
          ATHENA_SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set +x
          python3 -m pip install --quiet "${GITHUB_WORKSPACE}"
          athena monitor \
            --target . \
            --repo "${ATHENA_SCAN_REPO}" \
            --branch "${ATHENA_SCAN_BRANCH}" \
            --modes code-review,secrets,iac,sca,pipeline \
            --quiet
