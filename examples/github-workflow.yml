# Copy to .github/workflows/athena.yml
# Store ATHENA_API_URL and ATHENA_API_KEY as repository secrets. Never put them here.

name: Athena SAST
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  local:
    name: Local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Athena local
        run: |
          set +x
          python3 -m pip install "athena-sast==1.1.1"
          athena scan \
            --local . \
            --exclude '.github/**' \
            --modes pipeline \
            --fail-on high \
            --format table

  engine:
    name: Engine
    if: ${{ vars.ATHENA_ENABLE_ENGINE == 'true' }}
    runs-on: ubuntu-latest
    env:
      ATHENA_API_URL: ${{ secrets.ATHENA_API_URL }}
      ATHENA_API_KEY: ${{ secrets.ATHENA_API_KEY }}
      ATHENA_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Athena engine
        env:
          ATHENA_SCAN_REPO: ${{ github.server_url }}/${{ github.repository }}.git
          ATHENA_SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set +x
          python3 -m pip install "athena-sast==1.1.1"
          athena scan \
            --repo "${ATHENA_SCAN_REPO}" \
            --branch "${ATHENA_SCAN_BRANCH}" \
            --modes code-review,secrets,iac,sca \
            --fail-on high \
            --format table
