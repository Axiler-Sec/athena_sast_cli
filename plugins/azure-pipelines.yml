# Copy of ../azure-pipelines.yml
trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      set +x
      python3 -m pip install "athena-sast==1.1.1"
      athena scan --local "$(Build.SourcesDirectory)" --modes pipeline --fail-on high --format table
    displayName: Athena local
    env:
      ATHENA_API_URL: $(ATHENA_API_URL)
      ATHENA_API_KEY: $(ATHENA_API_KEY)
